# Markdown link checker (https://github.com/lycheeverse/lychee)
max_concurrency = 8
timeout = 20
accept = [200, 206, 429]

exclude_path = [
  "(^|/)node_modules($|/)",
  "(^|/)dist($|/)",
  "(^|/)coverage($|/)",
  "(^|/)\\.git($|/)",
]

# Relative and internal docs links are the main signal; skip noisy externals.
exclude = ['^https://api\\.slack\\.com/', '^https://unpkg\\.com/']

# Local runbook URLs (127.0.0.1 / localhost) are not live during link checks.
exclude_loopback = true
