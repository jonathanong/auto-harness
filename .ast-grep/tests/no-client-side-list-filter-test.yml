id: no-client-side-list-filter
valid:
  - |
    async function load() {
      const rows = await apiGetAllPages<Row>("/api/v1/sessions?worktreeId=wt&limit=100");
      return rows.map((row) => row.id);
    }
  - |
    async function load() {
      return (await apiGetAllPages("/api/v1/repositories?limit=100")).toSorted(byName);
    }
invalid:
  - |
    async function load() {
      return (await apiGetAllPages<Row>("/api/v1/sessions?limit=100")).find((r) => r.id === id);
    }
  - |
    async function load() {
      const rows = await apiGetAllPages("/api/v1/sessions?limit=100");
      return rows.filter((r) => r.worktreeId === id);
    }
  - |
    async function load() {
      const rows = await apiGetAllPages<Row>("/api/v1/repositories?limit=100");
      return rows.toSorted(byName).find((r) => r.id === id);
    }
