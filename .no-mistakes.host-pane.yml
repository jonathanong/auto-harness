# Isolated per-project config — see .no-mistakes.yml for why this is split out
# (https://github.com/jonathanong/no-mistakes/issues/624).
projects:
  host-pane:
    type: nextjs
    root: services/host-pane

# frontendRoot/selectorRoots work around no-mistakes not recognizing the
# src/app Next.js layout (https://github.com/jonathanong/no-mistakes/issues/625) —
# without frontendRoot, route findings come back bogus-prefixed ("/src/app/...").
# selectorRoots must be set back to the full src tree, or narrowing to just
# frontendRoot silently drops selector coverage for src/components/*.
tests:
  playwright:
    configs: playwright.config.ts
    frontendRoot: services/host-pane/src/app
    selectorRoots:
      - services/host-pane/src
    selectors:
      testIds:
        - data-pw

rules:
  - rule: playwright-unique-test-ids
    tests:
      playwright: [host-pane]
  - rule: playwright-coverage
    tests:
      playwright: [host-pane]
