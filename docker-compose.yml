# Official Amazon DynamoDB Local for development (no AWS account required).
# Start: pnpm local:dynamodb  (or docker compose up -d dynamodb)
services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    container_name: auto-harness-dynamodb
    ports:
      # Host :7423 → container DynamoDB Local (trails API :7420 / web :7421 / agent-web :7422)
      - "7423:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    # -inMemory is fine for local/tests; use -dbPath /data for durable local data

  # Dedicated instance for `pnpm test:e2e` — separate container, separate port range
  # (743x, +10 offset), so a Playwright run never shares state with (or gets confused by)
  # a manual `pnpm local:*` dev session, and force-recreating it wipes prior e2e data on
  # every run instead of letting hundreds of test-created repos/worktrees accumulate.
  dynamodb-e2e:
    image: amazon/dynamodb-local:3.3.1
    container_name: auto-harness-dynamodb-e2e
    ports:
      - "7433:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
