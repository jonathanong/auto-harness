projects:
  control-web:
    type: nextjs
    root: services/web
  host-pane:
    type: nextjs
    root: services/host-pane

# No `rules:` here. Applying playwright-coverage/playwright-unique-test-ids for both
# projects in one config cross-contaminates findings (see
# https://github.com/jonathanong/no-mistakes/issues/624) — each project's rules run
# from its own isolated config instead. See .no-mistakes.control.yml and
# .no-mistakes.host-pane.yml, run together via `pnpm check:data-pw`.
