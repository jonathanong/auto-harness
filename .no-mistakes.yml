projects:
  control-web:
    type: nextjs
    root: services/web
  host-pane:
    type: nextjs
    root: services/host-pane

# Bind each Playwright project to one Next.js app. A single config is safe
# after no-mistakes#626 (0.40+); the earlier split-config workaround is gone.
# frontendRoot/selectorRoots stay explicit so src/app route detection and
# src/components selector coverage cannot silently regress (#625).
checks:
  commands:
    - name: typecheck-shared
      command: [pnpm, --dir, modules/shared, exec, tsc, --noEmit]
      fileArgs: none
      always: true
    - name: typecheck-cdk
      command: [pnpm, --dir, services/cdk, exec, tsc, --noEmit]
      fileArgs: none
      always: true
    - name: typecheck-host-pane
      command: [pnpm, --dir, services/host-pane, exec, tsc, --noEmit]
      fileArgs: none
      always: true
    - name: typecheck-web
      command: [pnpm, --dir, services/web, exec, tsc, --noEmit]
      fileArgs: none
      always: true
    - name: typecheck-host-daemon
      command: [pnpm, --dir, services/host-daemon, exec, tsc, --noEmit]
      fileArgs: none
      always: true
    - name: typecheck-api
      command: [pnpm, --dir, services/api, exec, tsc, --noEmit]
      fileArgs: none
      always: true

tests:
  vitest:
    configs: vitest.config.ts
    projects:
      unit:
        include:
          - modules/**/*.test.ts
          - modules/**/*.test.tsx
          - services/**/*.test.ts
          - services/**/*.test.tsx
          - scripts/**/*.test.ts
      integration:
        include:
          - integration/**/*.test.ts
  playwright:
    configs: playwright.config.ts
    selectorExclude:
      - "**/*.test.ts"
      - "**/*.test.tsx"
    selectors:
      testIds:
        - data-pw
      componentTestIds:
        dataPw: data-pw
    apps:
      control:
        project: control-web
        frontendRoot: services/web/src/app
        selectorRoots:
          - services/web/src
      host-pane:
        project: host-pane
        frontendRoot: services/host-pane/src/app
        selectorRoots:
          - services/host-pane/src

rules:
  - rule: playwright-unique-test-ids
    projects: [control-web]
    tests:
      playwright: [control]
  - rule: playwright-coverage
    projects: [control-web]
    tests:
      playwright: [control]
  - rule: playwright-prefer-test-id-locators
    projects: [control-web]
    tests:
      playwright: [control]
  - rule: playwright-unique-test-ids
    projects: [host-pane]
    tests:
      playwright: [host-pane]
  - rule: playwright-coverage
    projects: [host-pane]
    tests:
      playwright: [host-pane]
  - rule: playwright-prefer-test-id-locators
    projects: [host-pane]
    tests:
      playwright: [host-pane]

  - rule: lockfile-allowlist
    scope: repository
    options:
      allowed: [pnpm-lock.yaml]
  - rule: package-json-workspace-coverage
    scope: repository
    options:
      packageRoots: [modules, services]
      requireNamedPackage: true
  - rule: package-json-registry-only
    scope: repository
    options:
      lockfile: pnpm-lock.yaml
  - rule: agents-md-max-size
    scope: repository
    options:
      maxLines: 200
      maxChars: 12000
  - rule: no-empty-or-comments-only-files
    scope: repository
    exclude:
      - "**/next-env.d.ts"
  - rule: file-extension-policy
    scope: repository
    options:
      scopes:
        - path: modules
          bannedExtensions: [".js", ".jsx"]
        - path: services
          bannedExtensions: [".js", ".jsx"]
  - rule: workspace-package-cycles
    scope: repository
    options:
      dependencyTypes: [dependencies, devDependencies]
  - rule: markdown-mermaid-validation
    scope: repository
    include: ["**/*.md"]

  - rule: nextjs-no-api-routes
    projects: [control-web]
  - rule: nextjs-no-caching
    projects: [control-web]
  - rule: nextjs-no-caching
    projects: [host-pane]
  - rule: banned-paths
    scope: repository
    options:
      bannedPaths:
        - glob: services/web/src/app/api/**
          message: Control-plane API routes belong in services/api, not the Next.js app.
        - glob: services/web/src/pages/**
          message: Next.js pages router files are not allowed.
        - glob: services/host-pane/src/pages/**
          message: Next.js pages router files are not allowed.

  - rule: integration-test-no-mocks
    include:
      - integration/**/*.test.ts
    options:
      forbiddenCalls: [vi.mock, vi.spyOn]

  - rule: github-actions-pinned-hash
    scope: repository
  - rule: markdown-reachability
    scope: repository
    include: ["**/*.md"]
    options:
      rootFilenames: [CLAUDE.md, AGENTS.md]
      indexFilenames: [README.md, docs/README.md]
      maxDepth: 2
  - rule: production-dependency-declarations
    scope: repository
    options:
      workspaceRoots: [modules, services]
  - rule: finite-set-consistency
    scope: repository
    options:
      sets:
        - name: sessionStatusType
          file: modules/shared/src/types.ts
          kind: ts-string-union
          target: SessionStatus
        - name: sessionStatusConst
          file: modules/shared/src/constants.ts
          kind: ts-array-literal
          target: SESSION_STATUSES
        - name: sessionSourceType
          file: modules/shared/src/types.ts
          kind: ts-string-union
          target: SessionSource
        - name: sessionSourceConst
          file: modules/shared/src/constants.ts
          kind: ts-array-literal
          target: SESSION_SOURCES
        - name: sessionErrorType
          file: modules/shared/src/types.ts
          kind: ts-string-union
          target: SessionErrorCode
        - name: sessionErrorConst
          file: modules/shared/src/constants.ts
          kind: ts-array-literal
          target: SESSION_ERROR_CODES
        - name: userRoleType
          file: modules/shared/src/types.ts
          kind: ts-string-union
          target: UserRole
        - name: userRoleConst
          file: modules/shared/src/constants.ts
          kind: ts-array-literal
          target: USER_ROLES
        - name: worktreeStatusType
          file: modules/shared/src/types.ts
          kind: ts-string-union
          target: WorktreeStatus
        - name: worktreeStatusConst
          file: modules/shared/src/constants.ts
          kind: ts-array-literal
          target: WORKTREE_STATUSES
      comparisons:
        - left: sessionStatusType
          right: sessionStatusConst
        - left: sessionSourceType
          right: sessionSourceConst
        - left: sessionErrorType
          right: sessionErrorConst
        - left: userRoleType
          right: userRoleConst
        - left: worktreeStatusType
          right: worktreeStatusConst
  - rule: tsconfig-gate-coverage
    scope: repository
    options:
      allowProjects:
        tsconfig.json: Root editor include set; packages typecheck via their own tsconfig.json.
        tsconfig.base.json: Shared compilerOptions only; not a tsc project.
  - rule: vitest-project-mapping
    scope: repository
    options:
      testExtensions: [.test.ts, .test.tsx]
      explicitProjectsOnly: true
