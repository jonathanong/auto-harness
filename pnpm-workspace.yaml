packages:
  - actions/*
  - modules/*
  - services/*

# One catalog for the shared UI runtime. Apps and @auto-harness/ui must use `catalog:`.
# A per-package Next pin installs a second copy and splits App Router context.
catalog:
  next: ^16.4.3
  react: ^19.3.1
  react-dom: ^19.3.1

onlyBuiltDependencies:
  - "@ast-grep/cli"
  - no-mistakes
  - sharp

overrides:
  nanoid: ^3.3.18
  postcss: ^8.5.28
  sharp: ^0.35.5
