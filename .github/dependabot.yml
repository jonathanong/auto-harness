# Dependabot version updates. Security updates are enabled separately in repo settings
# and still open their own pull requests (the version-update ignores below do not
# suppress those).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    # pnpm patchedDependencies pins this exact version; any bump needs a patch refresh.
    # Listing update-types ignores version PRs only — security PRs still open.
    ignore:
      - dependency-name: node-pty
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      npm-production:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /services/web
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker-compose:
        applies-to: version-updates
        patterns:
          - "*"
