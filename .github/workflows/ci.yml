name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # github.ref is refs/heads/main for every push to main, so an unconditional
  # cancel-in-progress here cancels one merge's still-running CI the moment the
  # next merge lands — leaving that commit's CI status permanently incomplete.
  # Only cancel superseded runs on a PR branch, where new pushes to the same ref
  # really do make the previous run stale.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-code-analysis:
    name: static-code-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Native type stripping (no tsc/tsx). Node ≥ 22.18 unflags it.
          node-version: "22.18"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Lint (ast-grep)
        run: pnpm lint:ast

      - name: Format check
        run: pnpm fmt:check

      - name: Knip
        run: pnpm knip

      - name: Dependency cruiser
        run: pnpm depcruise

      - name: Playwright selector coverage
        run: pnpm check:data-pw

      - name: systemd service contract
        run: pnpm check:systemd

      - name: Install lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml README.md AGENTS.md CLAUDE.md docs
          fail: true
          jobSummary: true

  vitest:
    name: vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Native job service container instead of `docker compose up` as a step: GitHub Actions
    # starts and links it before any step runs (in parallel with checkout/setup), and tears it
    # down with the runner — no docker-compose.yml dependency in CI at all. No --health-cmd:
    # the image has no curl/wget to run one with, and `pnpm local:dynamodb:ready` below already
    # polls the real DynamoDB client (waitForDynamo, up to 30s) before creating tables, which is
    # a more accurate readiness gate than a container-level health check would be anyway.
    services:
      dynamodb:
        image: amazon/dynamodb-local:2.5.2
        ports:
          - 7423:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Native type stripping (no tsc/tsx). Node ≥ 22.18 unflags it.
          node-version: "22.18"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Waits for the services: container above, then creates control-plane tables — needed
      # so write-through / createControlPlane branches hit coverage thresholds.
      - name: Bootstrap DynamoDB tables
        run: pnpm local:dynamodb:ready

      - name: Test with coverage
        run: pnpm test

      - name: Verify exact Dynamo adapter coverage
        run: pnpm check:coverage:dynamo-adapters

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      dynamodb:
        image: amazon/dynamodb-local:2.5.2
        ports:
          - 7423:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Bootstrap DynamoDB tables
        run: pnpm local:dynamodb:ready

      - name: Integration tests
        run: pnpm test:integration

  playwright:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        # --with-deps always for system libs; skip browser download when cache hit
        timeout-minutes: 5
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Build (e2e)
        # Production next build for control + host-pane into .next-e2e — see docs/e2e.md.
        run: pnpm build:web:e2e

      - name: Playwright E2E
        # CI is set by Actions → no server reuse, 2 workers, retries, github reporter
        run: pnpm exec playwright test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  playwright-auth:
    name: playwright (required auth)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Production control UI with required auth and fixed test-only credentials — see
      # docs/e2e.md. Set at job level: middleware.ts/api.ts read HARNESS_AUTH_MODE and
      # HARNESS_SESSION_SECRET at request time inside the webServer-started `next start`
      # process, so the Playwright test step needs them, not just the build step.
      HARNESS_E2E_AUTH: "1"
      HARNESS_AUTH_MODE: required
      HARNESS_SESSION_SECRET: auth-e2e-session-secret-auth-e2e-session-secret
      HARNESS_ADMINS: W3sidXNlcm5hbWUiOiJhdXRoLWFkbWluIiwicGFzc3dvcmQiOiJhdXRoLXBhc3N3b3JkIn1d
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Build (e2e, auth)
        run: pnpm build:web:auth-e2e

      - name: Playwright E2E (required auth)
        run: pnpm exec playwright test e2e/control/auth.spec.ts e2e/control/service-accounts.spec.ts e2e/control/user-accounts.spec.ts --project=control

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-auth
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
