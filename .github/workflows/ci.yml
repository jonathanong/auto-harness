name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # github.ref is refs/heads/main for every push to main, so an unconditional
  # cancel-in-progress here cancels one merge's still-running CI the moment the
  # next merge lands — leaving that commit's CI status permanently incomplete.
  # Only cancel superseded runs on a PR branch, where new pushes to the same ref
  # really do make the previous run stale.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-code-analysis:
    name: static-code-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Native type stripping (no tsc/tsx). Node ≥ 22.18 unflags it.
          node-version: "22.18"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Lint (ast-grep)
        run: pnpm lint:ast

      - name: Format check
        run: pnpm fmt:check

      # Incremental .tsbuildinfo for `pnpm typecheck` (`tsc --noEmit`). Not a tsc emit
      # build — runtime is still Node type-stripping. Restored so the gate stays cheap
      # as remaining packages join the filter.
      - name: Cache tsc incremental
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            modules/*/tsconfig.tsbuildinfo
            services/*/tsconfig.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.base.json', '**/tsconfig.json') }}
          restore-keys: |
            tsc-${{ runner.os }}-

      # Native type stripping means tsc never runs as part of a normal build — this is the
      # only place types are actually checked. Every workspace package is now covered.
      - name: Typecheck
        # Static `pnpm --dir <pkg> exec tsc --noEmit` so tsconfig-gate-coverage can
        # see each package project. Same set as `pnpm typecheck` (modules/ui is still
        # excluded — pre-existing violations).
        run: >
          pnpm --dir modules/shared exec tsc --noEmit
          && pnpm --dir services/cdk exec tsc --noEmit
          && pnpm --dir services/host-pane exec tsc --noEmit
          && pnpm --dir services/web exec tsc --noEmit
          && pnpm --dir services/host-daemon exec tsc --noEmit
          && pnpm --dir services/api exec tsc --noEmit

      - name: Knip
        run: pnpm knip

      - name: Dependency cruiser
        run: pnpm depcruise

      - name: no-mistakes
        run: pnpm check:no-mistakes

      - name: systemd service contract
        run: pnpm check:systemd

      - name: Install lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config lychee.toml README.md AGENTS.md CLAUDE.md docs
          fail: true
          jobSummary: true

  vitest-shard:
    name: vitest-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Native job service container instead of `docker compose up` as a step: GitHub Actions
    # starts and links it before any step runs (in parallel with checkout/setup), and tears it
    # down with the runner — no docker-compose.yml dependency in CI at all. No --health-cmd:
    # the image has no curl/wget to run one with, and `pnpm local:dynamodb:ready` below already
    # polls the real DynamoDB client (waitForDynamo, up to 30s) before creating tables, which is
    # a more accurate readiness gate than a container-level health check would be anyway.
    services:
      dynamodb:
        image: amazon/dynamodb-local:2.5.2
        ports:
          - 7423:8000
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Native type stripping (no tsc/tsx). Node ≥ 22.18 unflags it.
          node-version: "22.18"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Waits for the services: container above, then creates control-plane tables — needed
      # so write-through / createControlPlane branches hit coverage thresholds.
      - name: Bootstrap DynamoDB tables
        run: pnpm local:dynamodb:ready

      # Both the unit and integration vitest projects (vitest.config.ts) are split across
      # shards together and recombined in the vitest fan-in job below — one blob report per
      # shard, no coverage thresholds evaluated here (that happens once, on merged data).
      - name: Test (shard ${{ matrix.shard }}/2)
        run: pnpm test:shard --shard=${{ matrix.shard }}/2 --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}.json

      - name: Upload coverage blob
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  vitest:
    name: vitest
    needs: vitest-shard
    # Runs even if a shard failed, so this required check reports red instead of being
    # skipped (a plain `needs:` leaves a dependent job — and its required-check status —
    # unreported when a dependency fails).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fail if a shard failed
        if: needs.vitest-shard.result != 'success'
        run: |
          echo "a vitest shard failed or was cancelled (result: ${{ needs.vitest-shard.result }})"
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.18"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download coverage blobs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true

      # Recomputes coverage from the merged shard blobs and enforces the 98/97/100/98
      # thresholds (plus every per-file override) — the load-bearing coverage gate.
      - name: Merge shards and verify coverage
        run: pnpm test:merge

      - name: Verify exact Dynamo adapter coverage
        run: pnpm check:coverage:dynamo-adapters

  playwright-e2e:
    name: playwright-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.18"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        # --with-deps always for system libs; skip browser download when cache hit
        timeout-minutes: 5
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Clean e2e build output
        # Same wipe pnpm build:web:e2e does, run as its own step so it happens *before* the
        # cache restore below repopulates .next-e2e/cache — restoring first would just get
        # deleted by this rm -rf.
        run: rm -rf services/web/.next-e2e services/host-pane/.next-e2e

      - name: Cache Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            services/web/.next-e2e/cache
            services/host-pane/.next-e2e/cache
          # Source-hash key so a same-source rerun hits fully; restore-keys falls back to the
          # last lockfile-matched cache on a source change, since Next.js's cache is
          # per-file/incremental, not all-or-nothing — a partial hit still beats a cold build.
          key: nextjs-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('services/web/src/**/*.[jt]s', 'services/web/src/**/*.[jt]sx', 'services/host-pane/src/**/*.[jt]s', 'services/host-pane/src/**/*.[jt]sx', 'modules/**/src/**/*.[jt]s', 'modules/**/src/**/*.[jt]sx') }}-${{ hashFiles('services/web/next.config.ts', 'services/host-pane/next.config.ts', 'services/web/tsconfig.json', 'services/host-pane/tsconfig.json', 'services/web/tailwind.config.ts', 'services/host-pane/tailwind.config.ts', 'services/web/postcss.config.mjs', 'services/host-pane/postcss.config.mjs', 'services/web/package.json', 'services/host-pane/package.json') }}
          restore-keys: |
            nextjs-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build (e2e)
        # Production next build for control + host-pane into .next-e2e — see docs/e2e.md.
        # Calls each app's build:e2e directly (not the pnpm build:web:e2e wrapper), since that
        # wrapper's own rm -rf already ran above.
        run: pnpm --filter @auto-harness/web build:e2e && pnpm --filter @auto-harness/host-pane build:e2e

      - name: Playwright E2E
        # CI is set by Actions → no server reuse, 2 workers, retries, github reporter
        run: pnpm exec playwright test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  playwright-auth:
    name: playwright-auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Production control UI with required auth and fixed test-only credentials — see
      # docs/e2e.md. Set at job level: middleware.ts/api.ts read HARNESS_AUTH_MODE and
      # HARNESS_SESSION_SECRET at request time inside the webServer-started `next start`
      # process, so the Playwright test step needs them, not just the build step.
      HARNESS_E2E_AUTH: "1"
      HARNESS_AUTH_MODE: required
      HARNESS_SESSION_SECRET: auth-e2e-session-secret-auth-e2e-session-secret
      HARNESS_ADMINS: W3sidXNlcm5hbWUiOiJhdXRoLWFkbWluIiwicGFzc3dvcmQiOiJhdXRoLXBhc3N3b3JkIn1d
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.18"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Clean e2e build output
        run: rm -rf services/web/.next-e2e

      - name: Cache Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: services/web/.next-e2e/cache
          key: nextjs-e2e-auth-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('services/web/src/**/*.[jt]s', 'services/web/src/**/*.[jt]sx', 'modules/**/src/**/*.[jt]s', 'modules/**/src/**/*.[jt]sx') }}-${{ hashFiles('services/web/next.config.ts', 'services/web/tsconfig.json', 'services/web/tailwind.config.ts', 'services/web/postcss.config.mjs', 'services/web/package.json') }}
          restore-keys: |
            nextjs-e2e-auth-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build (e2e, auth)
        # Calls build:e2e directly (not the pnpm build:web:auth-e2e wrapper), since that
        # wrapper's own rm -rf already ran above.
        run: pnpm --filter @auto-harness/web build:e2e

      - name: Playwright E2E (required auth)
        run: pnpm exec playwright test e2e/control/auth.spec.ts e2e/control/service-accounts.spec.ts e2e/control/user-accounts.spec.ts --project=control

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-auth
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  playwright:
    name: playwright
    needs: [playwright-e2e, playwright-auth]
    # Runs even if a dependency failed, so this required check reports red instead of being
    # skipped (a plain `needs:` leaves a dependent job — and its required-check status —
    # unreported when a dependency fails).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if playwright-e2e or playwright-auth failed
        if: needs.playwright-e2e.result != 'success' || needs.playwright-auth.result != 'success'
        run: |
          echo "playwright-e2e: ${{ needs.playwright-e2e.result }}"
          echo "playwright-auth: ${{ needs.playwright-auth.result }}"
          exit 1
