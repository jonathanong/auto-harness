name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # github.ref is refs/heads/main for every push to main, so an unconditional
  # cancel-in-progress here cancels one merge's still-running CI the moment the
  # next merge lands — leaving that commit's CI status permanently incomplete.
  # Only cancel superseded runs on a PR branch, where new pushes to the same ref
  # really do make the previous run stale.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-code-analysis:
    name: static-code-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Native type stripping (no tsc/tsx). Node ≥ 22.18 unflags it.
          node-version: "22.18"
          cache: pnpm

      - name: Reject pull request client version bumps
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          base_version="$(git show "${BASE_SHA}:modules/client/package.json" | jq --exit-status --raw-output .version)"
          proposed_version="$(jq --exit-status --raw-output .version modules/client/package.json)"
          if test "$base_version" != "$proposed_version"; then
            echo "Client versions are created only by the Release client workflow; keep modules/client/package.json at ${base_version}." >&2
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Lint (ast-grep)
        run: pnpm lint:ast

      - name: Format check
        run: pnpm fmt:check

      # Incremental .tsbuildinfo for `pnpm typecheck` (`tsc --noEmit`). Not a tsc emit
      # build — runtime is still Node type-stripping. Restored so the gate stays cheap
      # as remaining packages join the filter.
      - name: Cache tsc incremental
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            modules/*/tsconfig.tsbuildinfo
            services/*/tsconfig.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.base.json', '**/tsconfig.json') }}
          restore-keys: |
            tsc-${{ runner.os }}-

      # Native type stripping means tsc never runs as part of a normal build — this is the
      # only place types are actually checked. Every workspace package is now covered.
      - name: Typecheck
        # Static `pnpm --dir <pkg> exec tsc --noEmit` so tsconfig-gate-coverage can
        # see each package project. Same set as `pnpm typecheck` — every workspace
        # package's tsconfig.json.
        run: >
          pnpm --dir modules/shared exec tsc --noEmit
          && pnpm --dir modules/ui exec tsc --noEmit
          && pnpm exec tsc --noEmit --project modules/client/tsconfig.json
          && pnpm --dir services/cdk exec tsc --noEmit
          && pnpm --dir services/host-pane exec tsc --noEmit
          && pnpm --dir services/web exec tsc --noEmit
          && pnpm --dir services/host-daemon exec tsc --noEmit
          && pnpm --dir services/api exec tsc --noEmit

      - name: Client package tests
        run: pnpm --dir modules/client test

      - name: Knip
        run: pnpm knip

      - name: Dependency cruiser
        run: pnpm depcruise

      - name: no-mistakes
        run: pnpm check:no-mistakes

      - name: systemd service contract
        run: pnpm check:systemd

      - name: Install lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config lychee.toml README.md AGENTS.md CLAUDE.md docs
          fail: true
          jobSummary: true

  test-shard-config:
    name: test-shard-config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      vitest_count: ${{ steps.shards.outputs.vitest_count }}
      vitest_matrix: ${{ steps.shards.outputs.vitest_matrix }}
      playwright_e2e_count: ${{ steps.shards.outputs.playwright_e2e_count }}
      playwright_e2e_matrix: ${{ steps.shards.outputs.playwright_e2e_matrix }}
    steps:
      - name: Resolve test shard counts
        id: shards
        env:
          CONFIGURED_VITEST_SHARDS: ${{ vars.VITEST_SHARDS }}
          CONFIGURED_PLAYWRIGHT_E2E_SHARDS: ${{ vars.PLAYWRIGHT_E2E_SHARDS }}
        run: |
          resolve_count() {
            local variable_name="$1"
            local configured="$2"
            local fallback="$3"

            if [[ "$configured" =~ ^[1-9][0-9]{0,2}$ ]] && (( configured <= 256 )); then
              echo "$configured"
              return
            fi

            echo "::warning title=Invalid shard count::$variable_name must be an integer from 1 to 256; using $fallback." >&2
            echo "$fallback"
          }

          vitest_count="$(resolve_count VITEST_SHARDS "$CONFIGURED_VITEST_SHARDS" 4)"
          playwright_e2e_count="$(resolve_count PLAYWRIGHT_E2E_SHARDS "$CONFIGURED_PLAYWRIGHT_E2E_SHARDS" 2)"
          vitest_matrix="$(jq --compact-output --null-input --argjson count "$vitest_count" '[range(1; $count + 1)]')"
          playwright_e2e_matrix="$(jq --compact-output --null-input --argjson count "$playwright_e2e_count" '[range(1; $count + 1)]')"

          {
            echo "vitest_count=$vitest_count"
            echo "vitest_matrix=$vitest_matrix"
            echo "playwright_e2e_count=$playwright_e2e_count"
            echo "playwright_e2e_matrix=$playwright_e2e_matrix"
          } >> "$GITHUB_OUTPUT"

  vitest-shard:
    name: vitest-${{ matrix.shard }}
    needs: test-shard-config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.test-shard-config.outputs.vitest_matrix) }}
    # Native job service container instead of `docker compose up` as a step: GitHub Actions
    # starts and links it before any step runs (in parallel with checkout/setup), and tears it
    # down with the runner — no docker-compose.yml dependency in CI at all. No --health-cmd:
    # the image has no curl/wget to run one with, and `pnpm local:dynamodb:ready` below already
    # polls the real DynamoDB client (waitForDynamo, up to 30s) before creating tables, which is
    # a more accurate readiness gate than a container-level health check would be anyway.
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 7423:8000
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Native type stripping (no tsc/tsx). Node ≥ 22.18 unflags it.
          node-version: "22.18"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Waits for the services: container above, then creates control-plane tables — needed
      # so write-through / createControlPlane branches hit coverage thresholds.
      - name: Bootstrap DynamoDB tables
        run: pnpm local:dynamodb:ready

      # Both the unit and integration vitest projects (vitest.config.ts) are split across
      # shards together and recombined in the vitest fan-in job below — one blob report per
      # shard, no coverage thresholds evaluated here (that happens once, on merged data).
      # coverage-check's provider also writes patch-only LCOV before filtering those files back out
      # of the aggregate blob, so the aggregate denominator remains unchanged.
      - name: Test (shard ${{ matrix.shard }}/${{ needs.test-shard-config.outputs.vitest_count }})
        run: pnpm test:shard --shard=${{ matrix.shard }}/${{ needs.test-shard-config.outputs.vitest_count }} --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}.json
        env:
          COVERAGE_CHECK_SUPPLEMENTAL_LCOV: coverage/supplemental/lcov.info

      - name: Upload coverage blob
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

      - name: Upload supplemental patch coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-patch-${{ matrix.shard }}
          path: coverage/supplemental/lcov.info
          retention-days: 1

  vitest-platform:
    name: vitest-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-latest
          - name: windows
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.18"
          cache: pnpm

      - name: Install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The focused tests need node-pty's pinned prebuild preparation. Run only that trusted
      # dependency's required scripts instead of enabling lifecycle scripts for the workspace.
      - name: Prepare native PTY dependency
        run: pnpm prepare:test:platform

      # Only native host-daemon boundaries are repeated off Linux: PTY, subprocesses,
      # git/worktree/path handling, host-service I/O, and one composed daemon run.
      - name: Test platform-sensitive host behavior
        run: pnpm test:platform

  vitest:
    name: vitest
    needs: [vitest-shard, vitest-platform]
    # Runs even if a shard or platform leg failed, so this required check reports red instead
    # of being skipped (a plain `needs:` leaves a dependent job — and its required-check
    # status — unreported when a dependency fails).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fail if a test job failed
        if: needs.vitest-shard.result != 'success' || needs.vitest-platform.result != 'success'
        run: |
          echo "vitest-shard: ${{ needs.vitest-shard.result }}"
          echo "vitest-platform: ${{ needs.vitest-platform.result }}"
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Patch coverage compares the checked-out tree with the event's exact base SHA.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.18"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download coverage blobs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true

      # Recomputes coverage from the merged shard blobs and enforces the aggregate
      # thresholds (99/99/99/99, plus every per-file override).
      - name: Merge shards and verify coverage
        run: pnpm test:merge

      # Download after test:merge because Vitest cleans coverage/ before writing the merged
      # aggregate reports. These fragments contain only patch-eligible files that are excluded
      # from the aggregate map.
      - name: Download supplemental patch coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: vitest-patch-*
          path: coverage/supplemental

      - name: Verify patch coverage
        run: pnpm check:coverage:patch --base "$COVERAGE_BASE_SHA"
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Verify exact Dynamo adapter coverage
        run: pnpm check:coverage:dynamo-adapters

  playwright-build:
    name: playwright-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # next.config.ts bakes this rewrite target and the matching public URLs/CSP into the
      # output. Keep the profile literal in the runtime-cache keys below in sync with it.
      HARNESS_API_HTTP: http://127.0.0.1:7430
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Exact runnable-output caches make docs/API-only changes and same-source reruns skip
      # next build entirely. They contain no credentials: auth is selected at next start time.
      - name: Cache control E2E runtime archive
        id: control-runtime-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/control-next-e2e.tgz
          key: nextjs-runtime-control-${{ runner.os }}-${{ runner.arch }}-api7430-v1-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'patches/**', 'tsconfig.base.json', 'services/web/package.json', 'services/web/src/**', 'services/web/public/**', 'services/web/next.config.ts', 'services/web/tsconfig.json', 'services/web/tailwind.config.ts', 'services/web/postcss.config.mjs', 'modules/ui/package.json', 'modules/ui/src/**', 'modules/shared/package.json', 'modules/shared/src/**') }}

      - name: Cache host-pane E2E runtime archive
        id: host-pane-runtime-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/host-pane-next-e2e.tgz
          key: nextjs-runtime-host-pane-${{ runner.os }}-${{ runner.arch }}-api7430-v1-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'patches/**', 'tsconfig.base.json', 'services/host-pane/package.json', 'services/host-pane/src/**', 'services/host-pane/public/**', 'services/host-pane/next.config.ts', 'services/host-pane/tsconfig.json', 'services/host-pane/tailwind.config.ts', 'services/host-pane/postcss.config.mjs', 'modules/ui/package.json', 'modules/ui/src/**', 'modules/shared/package.json', 'modules/shared/src/**') }}

      - name: Setup pnpm
        if: steps.control-runtime-cache.outputs.cache-hit != 'true' || steps.host-pane-runtime-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2

      - name: Setup Node
        if: steps.control-runtime-cache.outputs.cache-hit != 'true' || steps.host-pane-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.18"
          cache: pnpm

      - name: Install
        if: steps.control-runtime-cache.outputs.cache-hit != 'true' || steps.host-pane-runtime-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      # On an exact runtime miss, retain Next's per-file compiler cache as a fallback. These
      # paths are intentionally separate so changing one app does not invalidate the other.
      - name: Cache control Next.js incremental output
        if: steps.control-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: services/web/.next-e2e/cache
          key: nextjs-incremental-control-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('services/web/package.json', 'services/web/src/**', 'services/web/public/**', 'services/web/next.config.ts', 'services/web/tsconfig.json', 'services/web/tailwind.config.ts', 'services/web/postcss.config.mjs', 'modules/ui/package.json', 'modules/ui/src/**', 'modules/shared/package.json', 'modules/shared/src/**') }}
          restore-keys: |
            nextjs-incremental-control-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Cache host-pane Next.js incremental output
        if: steps.host-pane-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: services/host-pane/.next-e2e/cache
          key: nextjs-incremental-host-pane-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('services/host-pane/package.json', 'services/host-pane/src/**', 'services/host-pane/public/**', 'services/host-pane/next.config.ts', 'services/host-pane/tsconfig.json', 'services/host-pane/tailwind.config.ts', 'services/host-pane/postcss.config.mjs', 'modules/ui/package.json', 'modules/ui/src/**', 'modules/shared/package.json', 'modules/shared/src/**') }}
          restore-keys: |
            nextjs-incremental-host-pane-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build both E2E apps
        if: steps.control-runtime-cache.outputs.cache-hit != 'true' && steps.host-pane-runtime-cache.outputs.cache-hit != 'true'
        run: pnpm --parallel --filter @auto-harness/web --filter @auto-harness/host-pane run build:e2e

      - name: Build control E2E app
        if: steps.control-runtime-cache.outputs.cache-hit != 'true' && steps.host-pane-runtime-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @auto-harness/web build:e2e

      - name: Build host-pane E2E app
        if: steps.control-runtime-cache.outputs.cache-hit == 'true' && steps.host-pane-runtime-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @auto-harness/host-pane build:e2e

      - name: Package control E2E runtime
        if: steps.control-runtime-cache.outputs.cache-hit != 'true'
        run: tar -czf "$RUNNER_TEMP/control-next-e2e.tgz" --exclude='services/web/.next-e2e/cache' services/web/.next-e2e

      - name: Package host-pane E2E runtime
        if: steps.host-pane-runtime-cache.outputs.cache-hit != 'true'
        run: tar -czf "$RUNNER_TEMP/host-pane-next-e2e.tgz" --exclude='services/host-pane/.next-e2e/cache' services/host-pane/.next-e2e

      # Artifacts are the guaranteed within-run handoff; caches above are only accelerators
      # across workflow runs and every miss regenerates the same canonical archives.
      - name: Upload E2E runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-next-build
          path: |
            ${{ runner.temp }}/control-next-e2e.tgz
            ${{ runner.temp }}/host-pane-next-e2e.tgz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  playwright-e2e:
    name: playwright-e2e-${{ matrix.shard }}
    needs: [playwright-build, test-shard-config]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.test-shard-config.outputs.playwright_e2e_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.18"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        # --with-deps always for system libs; skip browser download when cache hit
        timeout-minutes: 5
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Download E2E runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: playwright-next-build
          path: ${{ runner.temp }}/playwright-next-build

      - name: Extract E2E runtime
        run: |
          tar -xzf "$RUNNER_TEMP/playwright-next-build/control-next-e2e.tgz"
          tar -xzf "$RUNNER_TEMP/playwright-next-build/host-pane-next-e2e.tgz"

      - name: Playwright E2E shard ${{ matrix.shard }}/${{ needs.test-shard-config.outputs.playwright_e2e_count }}
        # CI is set by Actions → no server reuse, 2 workers, retries, github reporter
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ needs.test-shard-config.outputs.playwright_e2e_count }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  playwright-auth:
    name: playwright-auth
    needs: playwright-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Production control UI with required auth and fixed test-only credentials — see
      # docs/e2e.md. Set at job level: middleware.ts/api.ts read HARNESS_AUTH_MODE and
      # HARNESS_SESSION_SECRET at request time inside the webServer-started `next start`
      # process, so the Playwright test step needs them, not just the build step.
      HARNESS_E2E_AUTH: "1"
      HARNESS_AUTH_MODE: required
      HARNESS_SESSION_SECRET: auth-e2e-session-secret-auth-e2e-session-secret
      HARNESS_ADMINS: W3sidXNlcm5hbWUiOiJhdXRoLWFkbWluIiwicGFzc3dvcmQiOiJhdXRoLXBhc3N3b3JkIn1d
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.18"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Download E2E runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: playwright-next-build
          path: ${{ runner.temp }}/playwright-next-build

      - name: Extract control E2E runtime
        run: tar -xzf "$RUNNER_TEMP/playwright-next-build/control-next-e2e.tgz"

      - name: Playwright E2E (required auth)
        run: pnpm exec playwright test e2e/control/auth.spec.ts e2e/control/service-accounts.spec.ts e2e/control/user-accounts.spec.ts --project=control

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-auth
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  playwright:
    name: playwright
    needs: [playwright-e2e, playwright-auth]
    # Runs even if a dependency failed, so this required check reports red instead of being
    # skipped (a plain `needs:` leaves a dependent job — and its required-check status —
    # unreported when a dependency fails).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if playwright-e2e or playwright-auth failed
        if: needs.playwright-e2e.result != 'success' || needs.playwright-auth.result != 'success'
        run: |
          echo "playwright-e2e: ${{ needs.playwright-e2e.result }}"
          echo "playwright-auth: ${{ needs.playwright-auth.result }}"
          exit 1
