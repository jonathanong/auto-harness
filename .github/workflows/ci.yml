name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # github.ref is refs/heads/main for every push to main, so an unconditional
  # cancel-in-progress here cancels one merge's still-running CI the moment the
  # next merge lands — leaving that commit's CI status permanently incomplete.
  # Only cancel superseded runs on a PR branch, where new pushes to the same ref
  # really do make the previous run stale.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-code-analysis:
    name: static-code-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Native type stripping (no tsc/tsx). Node ≥ 22.18 unflags it.
          node-version: "22.18"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Lint (ast-grep)
        run: pnpm lint:ast

      - name: Format check
        run: pnpm fmt:check

      # Native type stripping means tsc never runs as part of a normal build — this is the
      # only place types are actually checked. Scoped to modules/shared, services/cdk, and
      # services/host-pane for now: the other four packages (services/api, services/web,
      # services/host-daemon, modules/ui) have pre-existing violations accumulated from
      # never having run this check before. See the tracking follow-up to bring them in one
      # at a time rather than block this gate on fixing all of them at once.
      - name: Typecheck
        run: pnpm typecheck

      - name: Knip
        run: pnpm knip

      - name: Dependency cruiser
        run: pnpm depcruise

      - name: Playwright selector coverage
        run: pnpm check:data-pw

      - name: systemd service contract
        run: pnpm check:systemd

      - name: Install lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml README.md AGENTS.md CLAUDE.md docs
          fail: true
          jobSummary: true

  vitest:
    name: vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Native type stripping (no tsc/tsx). Node ≥ 22.18 unflags it.
          node-version: "22.18"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # DynamoDB Local so write-through / createControlPlane branches hit coverage thresholds
      - name: Start DynamoDB Local
        run: pnpm local:dynamodb && pnpm local:dynamodb:ready

      - name: Test with coverage
        run: pnpm test

      - name: Verify exact Dynamo adapter coverage
        run: pnpm check:coverage:dynamo-adapters

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start DynamoDB Local
        run: pnpm local:dynamodb && pnpm local:dynamodb:ready

      - name: Integration tests
        run: pnpm test:integration

  playwright:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        # --with-deps always for system libs; skip browser download when cache hit
        timeout-minutes: 5
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Playwright E2E
        # CI is set by Actions → no server reuse, 2 workers, retries, github reporter
        run: pnpm test:e2e

      - name: Playwright E2E (required auth)
        # Production control UI with required auth and fixed test-only credentials
        run: pnpm test:e2e:auth

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
