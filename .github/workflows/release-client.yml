name: Release client

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version increment to publish from the current main branch
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # workflow_dispatch can name a ref. The environment's selected-branch policy is
    # the primary gate; this prevents a non-main run from even requesting it.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == format('{0}/.github/workflows/release-client.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    steps:
      # RELEASE_TOKEN is used only for Git transport. npm authentication remains OIDC.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
      - name: Checkout current origin/main
        run: |
          set -euo pipefail

          git fetch --force --tags origin '+refs/heads/main:refs/remotes/origin/main'
          git checkout --detach origin/main
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "RELEASE_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Resolve new or interrupted release
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          manifest_name="$(node -p "require('./modules/client/package.json').name")"
          manifest_version="$(node -p "require('./modules/client/package.json').version")"
          test "$manifest_name" = "auto-harness-client"
          test -n "$manifest_version"
          test -z "${NPM_TOKEN:-}"
          test -z "${NODE_AUTH_TOKEN:-}"
          case "$RUN_ATTEMPT" in
            '' | *[!0-9]*) echo "invalid GitHub run attempt: $RUN_ATTEMPT" >&2; exit 1 ;;
          esac
          if (( RUN_ATTEMPT < 1 )); then
            echo "invalid GitHub run attempt: $RUN_ATTEMPT" >&2
            exit 1
          fi

          npm_version_exists() {
            local output_file="$RUNNER_TEMP/npm-version.json"
            local error_file="$RUNNER_TEMP/npm-version.err"

            if npm view "$manifest_name@$1" version --json --registry=https://registry.npmjs.org >"$output_file" 2>"$error_file"; then
              return 0
            fi
            if grep -q 'E404' "$error_file"; then
              return 1
            fi
            cat "$error_file" >&2
            exit 1
          }

          start_new_release() {
            case "$RELEASE_TYPE" in
              patch | minor | major) ;;
              *) echo "unsupported release type: $RELEASE_TYPE" >&2; exit 1 ;;
            esac

            pnpm --dir modules/client version "$RELEASE_TYPE" --no-git-tag-version
            manifest_version="$(node -p "require('./modules/client/package.json').version")"
            release_tag="client-v${manifest_version}"

            if git rev-parse --verify --quiet "refs/tags/${release_tag}" >/dev/null; then
              echo "release tag already exists: ${release_tag}" >&2
              exit 1
            fi
            if npm_version_exists "$manifest_version"; then
              echo "npm version already exists without a matching release tag: ${manifest_name}@${manifest_version}" >&2
              exit 1
            fi
            release_mode="new"
          }

          release_tag="client-v${manifest_version}"
          if git rev-parse --verify --quiet "refs/tags/${release_tag}^{commit}" >/dev/null; then
            tag_commit="$(git rev-parse "refs/tags/${release_tag}^{commit}")"
            head_commit="$(git rev-parse HEAD)"
            if test "$tag_commit" = "$head_commit"; then
              if npm_version_exists "$manifest_version"; then
                if (( RUN_ATTEMPT > 1 )); then
                  release_mode="already-published"
                else
                  start_new_release
                fi
              else
                release_mode="retry-publish"
              fi
            else
              if ! git merge-base --is-ancestor "$tag_commit" "$head_commit"; then
                echo "release tag is not an ancestor of current main: ${release_tag}" >&2
                exit 1
              fi
              if npm_version_exists "$manifest_version"; then
                if (( RUN_ATTEMPT > 1 )); then
                  release_mode="already-published"
                else
                  start_new_release
                fi
              else
                git checkout --detach "$release_tag"
                test "$(git rev-parse HEAD)" = "$tag_commit"
                release_mode="retry-publish"
              fi
            fi
          else
            start_new_release
          fi

          {
            echo "RELEASE_MODE=$release_mode"
            echo "RELEASE_VERSION=$manifest_version"
            echo "RELEASE_TAG=$release_tag"
          } >> "$GITHUB_ENV"
      - name: Install release snapshot
        if: env.RELEASE_MODE != 'already-published'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate package
        if: env.RELEASE_MODE != 'already-published'
        run: |
          set -euo pipefail

          test "$(node -p "require('./modules/client/package.json').name")" = "auto-harness-client"
          test "$(node -p "require('./modules/client/package.json').version")" = "$RELEASE_VERSION"
          pnpm exec tsc --noEmit --project modules/client/tsconfig.json
          pnpm --filter auto-harness-client test
          pnpm --dir modules/client pack --dry-run
      - name: Commit and tag release
        if: env.RELEASE_MODE == 'new'
        run: |
          set -euo pipefail

          git fetch --force origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse origin/main)" = "$RELEASE_BASE_SHA"
          test "$(git diff --name-only)" = "modules/client/package.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- modules/client/package.json
          git commit -m "release(client): v${RELEASE_VERSION}"
          git tag --annotate "$RELEASE_TAG" --message "Release client v${RELEASE_VERSION}"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/${RELEASE_TAG}"
      - name: Publish with npm OIDC provenance
        if: env.RELEASE_MODE != 'already-published'
        run: |
          set -euo pipefail

          test -z "${NPM_TOKEN:-}"
          test -z "${NODE_AUTH_TOKEN:-}"
          npm publish --provenance --access public --registry=https://registry.npmjs.org
        working-directory: modules/client
