name: Auto Harness dispatch
description: Dispatch a session or manage the authenticated principal's repository session drain
inputs:
  operation:
    description: dispatch (default), start-drain, get-drain, wait-for-drain, or release-drain
    required: false
    default: dispatch
  server-url:
    description: Auto Harness control-plane URL
    required: true
  api-key:
    description: Auto Harness service-account API key
    required: true
  request-timeout-seconds:
    description: Maximum time for each dispatch or drain request, including its response body (finite positive number, at most 300)
    required: false
    default: "30"
  repository-id:
    description: Auto Harness repository ID
    required: true
  prompt:
    description: Prompt for the session
    required: false
  target:
    description: JSON target, for example {"providerId":"codex"}
    required: false
  timeout:
    description: Maximum session runtime in seconds (required for dispatch)
    required: false
  fallbacks:
    description: Optional JSON array of fallback targets
    required: false
  ref:
    description: Optional branch, tag, or SHA
    required: false
  concurrency-id:
    description: Optional idempotency/concurrency identity
    required: false
  metadata:
    description: Optional JSON object with string, number, boolean, or null values
    required: false
  idempotency-key:
    description: Stable 1-128 character Idempotency-Key for start-drain retries
    required: false
  session-drain-id:
    description: Durable operation ID for get-drain, wait-for-drain, or release-drain
    required: false
  poll-interval-seconds:
    description: Delay between wait-for-drain status requests
    required: false
    default: "5"
  poll-timeout-seconds:
    description: Maximum wait-for-drain time before this action fails
    required: false
    default: "900"
outputs:
  session-id:
    description: Created or deduplicated session ID
  session-url:
    description: Control-plane URL for the session
  created:
    description: Whether this invocation created a new session
  operation-id:
    description: Durable principal session-drain operation ID
  status-url:
    description: Absolute URL for polling the principal session drain
  drain-status:
    description: draining, succeeded, failed, or released
  drain-terminal:
    description: Whether the returned drain status is terminal; wait-for-drain succeeds only for succeeded
  queued-count:
    description: Matching queued sessions remaining
  running-count:
    description: Matching running or lease-holding cancelled sessions remaining
  cancelled-count:
    description: Number of cancellation mutations attempted by the drain
  failure-code:
    description: Terminal drain failure code, when status is failed
runs:
  using: node20
  main: dist/index.js
